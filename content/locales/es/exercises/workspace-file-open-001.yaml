id: workspace-file-open-001
title: "Abre un archivo por su nombre, edítalo y guárdalo"
instruction: 'Estás editando src/main.ts. Abre src/util.ts, el archivo del que importa, añade el comentario de cabecera "// Shared helpers" como primera línea, y guarda el archivo sin salir del editor.'
hints:
  - "Abrir un archivo es un solo comando del editor, y nombra el archivo."
  - "Abre src/util.ts por su ruta, escribe la línea de comentario arriba y guarda el búfer escribiéndolo en el disco."
explanation: "Abrir por ruta añade un segundo búfer y lo muestra, y el archivo que estabas editando sigue abierto detrás. El cursor empieza arriba del archivo, así que escribir ahí pone el comentario encima del código, y guardar es lo que escribe el cambio: hasta entonces solo lo tiene el búfer."
