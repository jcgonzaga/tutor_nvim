id: vim-words-next-line-001
title: "w cruza líneas"
instruction: "Salta al inicio del segundo import."
hints:
  - "w no se detiene al final de una línea."
  - "Una palabra hasta os y otra más hasta la línea siguiente."
explanation: "w no se limita a la línea actual. La primera w va de import a os, y la segunda cruza el salto de línea hasta la primera palabra de la línea siguiente, así que llegas sin usar j."
