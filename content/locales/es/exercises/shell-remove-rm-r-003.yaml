id: shell-remove-rm-r-003
title: "Borrar un año antiguo"
instruction: "Borra la carpeta 2023 que está dentro de photos."
hints:
  - "Una carpeta: necesitas -r."
  - "rm -r photos/2023"
explanation: "photos/2023 es una carpeta, así que rm necesita -r; la ruta photos/2023 nombra justo ese año. photos/2024 y readme.txt se quedan. La ruta exacta importa: una carpeta equivocada se borra igual de definitivamente."
