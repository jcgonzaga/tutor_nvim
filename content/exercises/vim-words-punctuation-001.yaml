schemaVersion: 1

id: vim-words-punctuation-001
slug: vim.words.punctuation-001

title: "Words stop at punctuation"
instruction: "Jump to the start of qty."

skillIds:
  - vim.navigation.words

mode: imitate
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    const total = price * qty;
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: cursor_at
  line: 1
  column: 23

solutions:
  - sequence: "wwwww"
    classification: optimal

evaluation:
  requireFinalNormalMode: false

antiPatterns:
  - excessive_hjkl
  - arrow_keys

hints:
  - afterMs: 4000
    level: 1
    text: "= and * count as words of their own for w."
  - afterMs: 8000
    level: 2
    text: "Five jumps: total, =, price, *, qty."

metadata:
  language: javascript
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:javascript
