schemaVersion: 1

id: vim-inner-word-diw-py-001
slug: vim.inner-word.diw-py-001

title: "Delete the word under the cursor"
instruction: "Empty the parentheses by deleting the name inside them."

skillIds:
  - vim.textobject.inner-word
  - vim.operator.delete

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    print(very_long_name)
  cursor:
    line: 1
    column: 12
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    print()

solutions:
  - sequence: "diw"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "The underscore is part of the word."
  - afterMs: 8000
    level: 2
    text: "diw"

metadata:
  language: python
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:python

explanation: "The underscore is a word character, so very_long_name is a single word and diw deletes all of it from the l in the middle, leaving print(). dw would only delete from the cursor to the end and leave very_ behind. Deleting does not enter INSERT mode, so there is no Esc."
