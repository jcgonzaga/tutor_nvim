schemaVersion: 1

id: vim-inner-braces-shell-001
slug: vim.inner-braces.shell-001

title: "Change a shell variable"
instruction: "Change the variable name inside ${ } to USER."

skillIds:
  - vim.operator.change
  - vim.textobject.inner-braces

mode: transfer
difficulty: 3

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    echo ${HOME}
  cursor:
    line: 1
    column: 8
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    echo ${USER}

solutions:
  - sequence: "ci{USER<Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "${ } has braces."
  - afterMs: 8000
    level: 2
    text: "ci{"

metadata:
  language: shell
  context: shell-script
  estimatedSeconds: 12
  transferTags:
    - context:shell

explanation: "In ${HOME} the braces are shell syntax, but Vim only sees a pair of { }. ci{ replaces HOME with USER and leaves ${ } intact. The text object works the same in any language."
