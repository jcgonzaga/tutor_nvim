schemaVersion: 1
kind: workspace
id: workspace-buffer-pick-001
slug: neovim.buffers.list.001
title: "Pick one of the open buffers"
instruction: "Open src/util.ts and then README.md, so the session has three buffers in this order: src/main.ts, src/util.ts, README.md. Then finish in src/main.ts by moving through those buffers, not by opening its path again."
skillIds:
  - neovim.buffers.list
mode: recall
difficulty: 3
environment:
  type: simulator
  profile: workspace-basic-v1
initialState:
  files:
    README.md: |
      # Demo app
      Start it with pnpm dev.
    src/main.ts: |
      import { add } from "./util";

      console.log(add(1, 2));
    src/util.ts: |
      export const add = (a: number, b: number) => a + b;
  path: src/main.ts
  cwd: /project
objective:
  type: all
  goals:
    - { type: active_file, path: src/main.ts }
    - { type: open_buffers, paths: [src/main.ts, src/util.ts, README.md] }
solutions:
  - actions:
      - action: file.open
        path: src/util.ts
      - action: file.open
        path: README.md
      - action: buffer.next
    classification: optimal
  - actions:
      - action: file.open
        path: src/util.ts
      - action: file.open
        path: README.md
      - action: buffer.previous
      - action: buffer.previous
    classification: efficient
hints:
  - afterMs: 4000
    level: 1
    text: "The list of buffers keeps the order you opened them in."
  - afterMs: 8000
    level: 2
    text: "From the last buffer, moving forward wraps around to the first one."
metadata:
  language: typescript
  context: source-code
  estimatedSeconds: 20
  transferTags: []
explanation: "The session opened main.ts, util.ts and README.md in that order, so from the last buffer one step forward wraps around to the first. Two steps back reach main.ts too, but crossing util.ts on the way costs a step."
