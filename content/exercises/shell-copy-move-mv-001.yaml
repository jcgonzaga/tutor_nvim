schemaVersion: 1
kind: shell
id: shell-copy-move-mv-001
slug: shell.copy-move.mv-001
title: Rename a file
instruction: Type mv ideas.txt old-ideas.txt to rename the file.
skillIds:
  - linux.shell.copy-move
mode: imitate
difficulty: 1
environment:
  type: simulator
  profile: shell-basic-v1
initialState:
  files:
    notes/todo.txt: |
      buy milk
      call mom
      buy bread
      book dentist
    notes/ideas.txt: |
      app for learning vim
      recipe site
    notes/archive/2023.txt: |
      old note
  cwd: notes
objective:
  type: fs_matches
  files:
    notes/old-ideas.txt: |
      app for learning vim
      recipe site
  absent:
    - notes/ideas.txt
solutions:
  - commands:
      - mv ideas.txt old-ideas.txt
    classification: optimal
antiPatterns: []
hints:
  - afterMs: 4000
    level: 1
    text: mv moves, and renaming is moving to a new name.
  - afterMs: 8000
    level: 2
    text: mv ideas.txt old-ideas.txt
metadata:
  language: bash
  context: notes
  estimatedSeconds: 15
  transferTags: []
explanation: "The shell has no separate rename command: mv ideas.txt old-ideas.txt moves the file to a new name in the same folder. The old name disappears and the content is kept, which is exactly what renaming means. cp would leave ideas.txt behind."
