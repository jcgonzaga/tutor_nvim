schemaVersion: 1

id: vim-inner-parens-di-py-001
slug: vim.inner-parens.di-py-001

title: "Empty a call"
instruction: "Remove all the arguments but keep the parentheses."

skillIds:
  - vim.operator.delete
  - vim.textobject.inner-parentheses

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    result = compute(1, 2, 3)
  cursor:
    line: 1
    column: 21
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    result = compute()

solutions:
  - sequence: "di("
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Delete + inside + parentheses."
  - afterMs: 8000
    level: 2
    text: "di("

metadata:
  language: python
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:python

explanation: "di( deletes everything between the parentheses around the cursor, whatever the number of arguments, leaving compute(). It works from any position inside the call, so you do not have to go to the first argument."
