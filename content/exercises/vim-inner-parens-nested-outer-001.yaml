schemaVersion: 1

id: vim-inner-parens-nested-outer-001
slug: vim.inner-parens.nested-outer-001

title: "Nested: the outer call"
instruction: "Replace all the arguments of foo with 0. The cursor is on the 2."

skillIds:
  - vim.operator.change
  - vim.textobject.inner-parentheses

mode: discriminate
difficulty: 4

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    foo(bar(1), 2)
  cursor:
    line: 1
    column: 13
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    foo(0)

solutions:
  - sequence: "ci(0<Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "The cursor is only inside the outer parentheses here."
  - afterMs: 8000
    level: 2
    text: "ci("

metadata:
  language: javascript
  context: source-code
  estimatedSeconds: 14
  transferTags:
    - context:javascript

explanation: "The cursor is on the 2, which is inside foo( ) but not inside bar( ). The innermost pair around it is foo's, so ci( replaces bar(1), 2 entirely with 0. Same keys as the previous exercise: the cursor position decides which parentheses count."
