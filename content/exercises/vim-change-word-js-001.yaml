schemaVersion: 1

id: vim-change-word-js-001
slug: vim.change.word-js-001

title: "Rename a variable"
instruction: "Rename count to total."

skillIds:
  - vim.operator.change

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    let count = 0;
  cursor:
    line: 1
    column: 5
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    let total = 0;

solutions:
  - sequence: "cwtotal<Esc>"
    classification: optimal
  - sequence: "dwitotal <Esc>"
    classification: valid

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Change + word."
  - afterMs: 8000
    level: 2
    text: "cw, type the new name, Esc."

metadata:
  language: javascript
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:javascript
