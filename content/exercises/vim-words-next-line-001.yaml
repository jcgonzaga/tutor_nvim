schemaVersion: 1

id: vim-words-next-line-001
slug: vim.words.next-line-001

title: "w crosses lines"
instruction: "Jump to the start of the second import."

skillIds:
  - vim.navigation.words

mode: transfer
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    import os
    import sys
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: cursor_at
  line: 2
  column: 1

solutions:
  - sequence: "ww"
    classification: optimal

evaluation:
  requireFinalNormalMode: false

antiPatterns:
  - excessive_hjkl
  - arrow_keys

hints:
  - afterMs: 4000
    level: 1
    text: "w does not stop at the end of a line."
  - afterMs: 8000
    level: 2
    text: "One word to os, one more to the next line."

metadata:
  language: python
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:python
