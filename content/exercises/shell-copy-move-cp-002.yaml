schemaVersion: 1
kind: shell
id: shell-copy-move-cp-002
slug: shell.copy-move.cp-002
title: Copy a config
instruction: Copy dev.env as staging.env in the same folder.
skillIds:
  - linux.shell.copy-move
mode: recall
difficulty: 2
environment:
  type: simulator
  profile: shell-basic-v1
initialState:
  files:
    project/README.md: |
      # Demo app
      Run the server with npm start.
    project/src/app.js: |
      const API_URL = 'http://localhost:3000';
      console.log(API_URL);
    project/src/util.js: |
      export const add = (a, b) => a + b;
    project/config/dev.env: |
      API_URL=http://localhost:3000
      DEBUG=true
    project/config/prod.env: |
      API_URL=https://api.example.com
      DEBUG=false
  cwd: project/config
objective:
  type: fs_matches
  files:
    project/config/dev.env: |
      API_URL=http://localhost:3000
      DEBUG=true
    project/config/staging.env: |
      API_URL=http://localhost:3000
      DEBUG=true
solutions:
  - commands:
      - cp dev.env staging.env
    classification: optimal
antiPatterns: []
hints:
  - afterMs: 4000
    level: 1
    text: The original must stay.
  - afterMs: 8000
    level: 2
    text: cp dev.env staging.env
metadata:
  language: bash
  context: config
  estimatedSeconds: 20
  transferTags: []
explanation: "You are already in config, so no paths are needed: cp dev.env staging.env creates staging.env with the same content and keeps dev.env. mv would be wrong here, because it would rename the original and the objective needs both files."
