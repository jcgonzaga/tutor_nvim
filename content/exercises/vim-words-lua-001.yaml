schemaVersion: 1

id: vim-words-lua-001
slug: vim.words.lua-001

title: "Jump to a string's content"
instruction: "Jump to the t of tutor."

skillIds:
  - vim.navigation.words

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    local name = "tutor"
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: cursor_at
  line: 1
  column: 15

solutions:
  - sequence: "wwww"
    classification: optimal

evaluation:
  requireFinalNormalMode: false

antiPatterns:
  - excessive_hjkl
  - arrow_keys

hints:
  - afterMs: 4000
    level: 1
    text: "The opening quote is a word stop too."
  - afterMs: 8000
    level: 2
    text: "local, name, =, the quote, then tutor."

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua
