schemaVersion: 1

id: vim-append-o-lua-001
slug: vim.append.o-lua-001

title: "Add a second variable"
instruction: "Add local b = 2 on the line below."

skillIds:
  - vim.insert.append-open

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    local a = 1
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    local a = 1
    local b = 2

solutions:
  - sequence: "olocal b = 2<Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - insert_mode_navigation
  - repeated_escape

hints:
  - afterMs: 4000
    level: 1
    text: "Do you need to move to the end of the line first?"
  - afterMs: 8000
    level: 2
    text: "o does it for you."

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua
