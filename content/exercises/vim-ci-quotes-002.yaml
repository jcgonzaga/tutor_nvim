schemaVersion: 1

id: vim-ci-quotes-002
slug: vim.ci-quotes.python-001

title: "Change inside quotes (Python)"
instruction: 'Change only the text inside the quotes to "db.internal".'

skillIds:
  - vim.operator.change
  - vim.textobject.inner-quotes

mode: transfer
difficulty: 3

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    DATABASE_URL = "localhost"
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    DATABASE_URL = "db.internal"

solutions:
  - sequence: 'ci"db.internal<Esc>'
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Same skill, another language: Change + Inside + quotes."
  - afterMs: 8000
    level: 2
    text: 'ci" finds the string even if the cursor is before it.'

metadata:
  language: python
  context: config-file
  estimatedSeconds: 8
  transferTags:
    - context:python
    - context:config-file
