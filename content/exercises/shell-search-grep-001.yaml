schemaVersion: 1
kind: shell
id: shell-search-grep-001
slug: shell.search.grep-001
title: Find the errors
instruction: Type grep ERROR app.log to show only the lines with ERROR.
skillIds:
  - linux.shell.search
mode: learn
difficulty: 1
environment:
  type: simulator
  profile: shell-basic-v1
initialState:
  files:
    logs/app.log: |
      INFO server started
      ERROR disk full
      INFO request ok
      ERROR timeout
      INFO shutdown
    logs/old/app.log.1: |
      INFO old start
      ERROR crash
  cwd: logs
objective:
  type: last_output_equals
  text: |
    ERROR disk full
    ERROR timeout
solutions:
  - commands:
      - grep ERROR app.log
    classification: optimal
antiPatterns: []
hints:
  - afterMs: 4000
    level: 1
    text: grep prints the lines that match.
  - afterMs: 8000
    level: 2
    text: grep ERROR app.log
metadata:
  language: bash
  context: logs
  estimatedSeconds: 15
  transferTags: []
explanation: "grep ERROR app.log prints only the lines of app.log that contain ERROR: disk full and timeout. Lines with INFO are skipped, and old/app.log.1 is not searched because you did not name it."
