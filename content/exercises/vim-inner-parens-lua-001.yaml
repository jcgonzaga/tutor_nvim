schemaVersion: 1

id: vim-inner-parens-lua-001
slug: vim.inner-parens.lua-001

title: "Change arguments in Lua"
instruction: "Change the arguments to x, y."

skillIds:
  - vim.operator.change
  - vim.textobject.inner-parentheses

mode: transfer
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    local x = math.max(a, b)
  cursor:
    line: 1
    column: 20
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    local x = math.max(x, y)

solutions:
  - sequence: "ci(x, y<Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Same skill, another language."
  - afterMs: 8000
    level: 2
    text: "ci("

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua
