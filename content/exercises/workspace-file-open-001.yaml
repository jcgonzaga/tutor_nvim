schemaVersion: 1
kind: workspace
id: workspace-file-open-001
slug: neovim.files.open.by-name-001
title: "Open a file by name, edit it and save it"
instruction: 'You are editing src/main.ts. Open src/util.ts, the file it imports from, add the header comment "// Shared helpers" as its first line, and save the file without leaving the editor.'
skillIds:
  - neovim.files.open
mode: learn
difficulty: 2
environment:
  type: simulator
  profile: workspace-basic-v1
initialState:
  files:
    README.md: |
      # Demo app
      Start it with pnpm dev.
    src/main.ts: |
      import { add } from "./util";

      console.log(add(1, 2));
    src/util.ts: |
      export const add = (a: number, b: number) => a + b;
  path: src/main.ts
  cwd: /project
objective:
  type: all
  goals:
    - { type: active_file, path: src/util.ts }
    - { type: open_buffers, paths: [src/main.ts, src/util.ts] }
    - type: buffer_text
      path: src/util.ts
      text: "// Shared helpers\nexport const add = (a: number, b: number) => a + b;"
    - type: file_text
      path: src/util.ts
      text: "// Shared helpers\nexport const add = (a: number, b: number) => a + b;"
solutions:
  - actions:
      - action: file.open
        path: src/util.ts
      - action: edit.insert
        text: "// Shared helpers\n"
      - action: file.save
    classification: optimal
hints:
  - afterMs: 4000
    level: 1
    text: "Opening a file is one editor command, and it names the file."
  - afterMs: 8000
    level: 2
    text: "Open src/util.ts by its path, type the comment line at the top, then save the buffer writing it to disk."
metadata:
  language: typescript
  context: source-code
  estimatedSeconds: 20
  transferTags: []
explanation: "Opening by path adds a second buffer and shows it, and the file you were editing stays open behind it. The cursor starts at the top of the file, so typing there puts the comment above the code, and saving is what writes the change: until then only the buffer has it."
