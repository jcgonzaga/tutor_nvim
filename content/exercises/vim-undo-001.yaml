schemaVersion: 1

id: vim-undo-001
slug: vim.undo.basic-001

title: "Undo one deletion"
instruction: 'Two words were deleted by mistake. Undo only the last deletion, so "two three" is left.'

skillIds:
  - vim.undo

mode: imitate
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    one two three
  cursor:
    line: 1
    column: 1
  vimMode: normal
  setupKeys: "dwdw"

objective:
  type: buffer_equals
  target: |
    two three

solutions:
  - sequence: "u"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns: []

hints:
  - afterMs: 4000
    level: 1
    text: "u undoes the last change."
  - afterMs: 8000
    level: 2
    text: "One press undoes one change."

metadata:
  language: text
  context: plain-text
  estimatedSeconds: 4
  transferTags: []

explanation: "The two dw commands are two separate changes. u undoes only the last one, so a single press brings back two and leaves two three. Each u goes one change back, so count how many steps you need."
