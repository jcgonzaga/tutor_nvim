schemaVersion: 1

id: vim-word-ends-end-001
slug: vim.word-ends.end-001

title: "Go to the end of a word"
instruction: "Move to the last letter of alpha."

skillIds:
  - vim.navigation.word-ends

mode: learn
difficulty: 1

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    alpha beta gamma
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: cursor_at
  line: 1
  column: 5

solutions:
  - sequence: "e"
    classification: optimal

evaluation:
  requireFinalNormalMode: false

antiPatterns:
  - excessive_hjkl
  - arrow_keys

hints:
  - afterMs: 4000
    level: 1
    text: "e jumps to the end of the current word."
  - afterMs: 8000
    level: 2
    text: "One key."

metadata:
  language: text
  context: plain-text
  estimatedSeconds: 8
  transferTags: []

explanation: "e moves to the last letter of the current word, here the final a of alpha. It is the motion to use when you want to land on the end of a word, for example to append after it. Moving with l would take four presses."
