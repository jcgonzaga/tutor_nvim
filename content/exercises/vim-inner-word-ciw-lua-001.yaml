title: "ciw in Lua"
instruction: "Give speed a better name: velocity. The cursor is in the middle of the word."

skillIds:
  - vim.textobject.inner-word
  - vim.operator.change

mode: transfer
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    local speed = 10
  cursor:
    line: 1
    column: 9
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    local velocity = 10

solutions:
  - sequence: "ciwvelocity<Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Same command, another language."
  - afterMs: 8000
    level: 2
    text: "ciw"

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua
