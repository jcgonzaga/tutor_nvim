schemaVersion: 1

id: vim-di-quotes-js-001
slug: vim.di-quotes.js-001

title: "Empty a string"
instruction: "Delete the text inside the quotes but keep the quotes."

skillIds:
  - vim.operator.delete
  - vim.textobject.inner-quotes

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    const msg = "remove this text";
  cursor:
    line: 1
    column: 21
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    const msg = "";

solutions:
  - sequence: 'di"'
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Delete + inside + quotes."
  - afterMs: 8000
    level: 2
    text: 'di"'

metadata:
  language: javascript
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:javascript
