slug: shell.permissions.chmod-600-001
title: Keep it private
instruction: Type chmod 600 secret.txt so only you can read and write it.
skillIds:
  - linux.shell.permissions
mode: imitate
difficulty: 1
environment:
  type: simulator
  profile: shell-basic-v1
