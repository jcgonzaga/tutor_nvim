    secret.txt: |
      token=abc
objective:
  type: fs_matches
  modes:
    secret.txt: "600"
solutions:
  - commands:
      - chmod 600 secret.txt
    classification: optimal
antiPatterns: []
hints:
  - afterMs: 4000
