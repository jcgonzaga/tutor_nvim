schemaVersion: 1

id: vim-undo-insert-001
slug: vim.undo.insert-001

title: "Undo some typing"
instruction: "Someone typed hello before world. Undo it."

skillIds:
  - vim.undo

mode: learn
difficulty: 1

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    world
  cursor:
    line: 1
    column: 1
  vimMode: normal
  setupKeys: "ihello <Esc>"

objective:
  type: buffer_equals
  target: |
    world

solutions:
  - sequence: "u"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns: []

hints:
  - afterMs: 4000
    level: 1
    text: "u undoes the whole insert in one step."
  - afterMs: 8000
    level: 2
    text: "u"

metadata:
  language: text
  context: plain-text
  estimatedSeconds: 8
  transferTags: []
