schemaVersion: 1

id: vim-inner-braces-js-object-001
slug: vim.inner-braces.js-object-001

title: "Change an object's contents"
instruction: "Set debug to false inside the braces."

skillIds:
  - vim.operator.change
  - vim.textobject.inner-braces

mode: imitate
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    const opts = { debug: true };
  cursor:
    line: 1
    column: 16
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    const opts = { debug: false };

solutions:
  - sequence: "ci{ debug: false <Esc>"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - repeated_x
  - excessive_hjkl
  - arrow_keys
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "On one line, the spaces next to the braces are inside them too."
  - afterMs: 8000
    level: 2
    text: "ci{, type the contents with its spaces, Esc."

metadata:
  language: javascript
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:javascript

explanation: 'i{ is everything between { and }, including the spaces next to them, so ci{ deletes " debug: true " and the braces stay. That is why you type the new contents with a space before and after it. Without them you would get {debug: false}.'
