schemaVersion: 1

id: vim-find-char-quote-001
slug: vim.find-char.quote-001

title: "Find the opening quote"
instruction: "Jump onto the first double quote."

skillIds:
  - vim.navigation.find-char

mode: transfer
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    print("hello")
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: cursor_at
  line: 1
  column: 7

solutions:
  - sequence: 'f"'
    classification: optimal

evaluation:
  requireFinalNormalMode: false

antiPatterns:
  - excessive_hjkl
  - arrow_keys

hints:
  - afterMs: 4000
    level: 1
    text: "f works with any character, quotes too."
  - afterMs: 8000
    level: 2
    text: 'f"'

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua

explanation: 'f works with any single character, quotes included, so f" jumps onto the first double quote after the cursor. Quotes are typical targets in code because they mark where a string starts.'
