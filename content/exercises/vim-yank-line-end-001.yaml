schemaVersion: 1

id: vim-yank-line-end-001
slug: vim.yank.line-end-001

title: "Copy a line to the end"
instruction: "Add a copy of the first line at the end."

skillIds:
  - vim.operator.yank

mode: recall
difficulty: 2

environment:
  type: simulator
  profile: vim-basic-v1

# Cursor positions in content are 1-based (line, column), as in Vim's ruler.
initialState:
  buffer: |
    local a = 1
    local b = 2
  cursor:
    line: 1
    column: 1
  vimMode: normal

objective:
  type: buffer_equals
  target: |
    local a = 1
    local b = 2
    local a = 1

solutions:
  - sequence: "yyjp"
    classification: optimal

evaluation:
  requireFinalNormalMode: true

antiPatterns:
  - insert_mode_navigation

hints:
  - afterMs: 4000
    level: 1
    text: "Copy it, go down, then put it below."
  - afterMs: 8000
    level: 2
    text: "yy, j, p."

metadata:
  language: lua
  context: source-code
  estimatedSeconds: 10
  transferTags:
    - context:lua
