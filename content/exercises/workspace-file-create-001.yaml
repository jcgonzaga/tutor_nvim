schemaVersion: 1
kind: workspace
id: workspace-file-create-001
slug: neovim.files.create.001
title: "Create a new file, write it and save it"
instruction: 'Start a new file called notes/todo.md, type the two lines "# TODO" and "- write the first exercise" into it, and save it. The path is not on disk yet, so the buffer opens empty and nothing is written until you save.'
skillIds:
  - neovim.files.create
mode: learn
difficulty: 2
environment:
  type: simulator
  profile: workspace-basic-v1
initialState:
  files:
    notes/README.md: |
      Notes for the project.
    src/main.ts: |
      import { add } from "./util";

      console.log(add(1, 2));
  path: src/main.ts
  cwd: /project
objective:
  type: all
  goals:
    - { type: active_file, path: notes/todo.md }
    - { type: open_buffers, paths: [src/main.ts, notes/todo.md] }
    - type: buffer_text
      path: notes/todo.md
      text: "# TODO\n- write the first exercise"
    - type: file_text
      path: notes/todo.md
      text: "# TODO\n- write the first exercise"
solutions:
  - actions:
      - action: file.new
        path: notes/todo.md
      - action: edit.insert
        text: "# TODO\n- write the first exercise"
      - action: file.save
    classification: optimal
hints:
  - afterMs: 4000
    level: 1
    text: "The file does not exist yet, so opening it by name would be refused."
  - afterMs: 8000
    level: 2
    text: "Start a new, empty file with the path you want it to have, type the text, then save it."
metadata:
  language: markdown
  context: notes
  estimatedSeconds: 20
  transferTags: []
explanation: "A new path starts an empty buffer: the editor keeps the name you gave it, and the file appears on disk only when you save. Typos are text, not keys: the buffer is what you typed, and saving is what writes it under that name."
