schemaVersion: 1

id: vim-edit-delete-char
slug: vim.edit.delete-char

title: "Delete a character"
description: "Remove the character under the cursor with x, and know when a bigger command is better."

domain: vim
tier: 2
difficulty: 1
enabled: true

prerequisites:
  - vim.navigation.atomic
concepts:
  - edit
  - character
tags:
  - edit
  - x

lesson:
  - title: "x deletes one character"
    body: "When a single stray character is wrong, put the cursor on it in NORMAL mode and press x. It deletes the character under the cursor and you stay in NORMAL mode."
    keys: "x"
  - title: "After x the text closes up"
    body: "The rest of the line shifts left to fill the gap, and the cursor stays in the same column, now on the next character. If you delete the last character of a line, the cursor steps back onto the new last one."
  - title: "One character, one x"
    body: "Pressing x many times works, but it is a slow habit. For a whole word or more, use an operator with a motion, such as dw, instead of counting presses."
    keys: "dw"
