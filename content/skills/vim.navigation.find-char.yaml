schemaVersion: 1

id: vim-navigation-find-char
slug: vim.navigation.find-char

title: "Find a character"
description: "Jump to a character on the line with f and t, and repeat with ; and ,."

domain: vim
tier: 2
difficulty: 3
enabled: true

prerequisites:
  - vim.navigation.line
concepts:
  - motion
  - search
tags:
  - motion
  - find

lesson:
  - title: "Jump to a character on the line"
    body: "f followed by a character moves the cursor onto the next occurrence of that character on the current line. It replaces pressing l many times."
    keys: "fe"
  - title: "It stops at the first match"
    body: "f stops on the first match to the right of the cursor. If you want a later one, press ; to repeat the search forward, or , to repeat it backward."
    keys: ";"
  - title: "Any character works"
    body: "f accepts any single character, including punctuation such as ( ) , = or quotes. Pick a character that is close to where you want to land."
